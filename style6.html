<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài tập session 02-5</title>
  </head>
  <body>
    <main>
      <table border="1">
        <thead>
          <tr>
            <th>item photo</th>
            <th>Name</th>
            <th>Price</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>
              <img
                src="https://img.freepik.com/premium-photo/ripe-juicy-orange_159938-1611.jpg"
                alt="Orange"
                width="100"
              />
            </td>
            <td>Orange</td>
            <td>$1 ea.</td>
          </tr>
          <tr>
            <td><img src="" alt="bananas" /></td>
            <td>Bananas</td>
            <td>#0.75/lb</td>
          </tr>
          <tr>
            <td>
              <img
                src="https://tse2.mm.bing.net/th/id/OIP._HcEypxs4fT-J12YKKnSgQHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3"
                alt="Pomegranate"
                width="100"
              />
            </td>
            <td>Pomegranates</td>
            <td>3 for $5</td>
          </tr>
          <tr>
            <td><img src="" alt="Gummy Bears" /></td>
            <td>Gummy Bears</td>
            <td>$6 per bag</td>
          </tr>
          <tr>
            <td>
              <img
                src="https://i5.walmartimages.com/seo/American-Seed-1G-Broccoli-Waltham-Plant-Seeds-Full-Sun_8e781e21-f088-4251-ac83-d979c10b9f60.cdc4935c70d7ee23c1b34cf6eade459b.jpeg?odnHeight=612&odnWidth=612&odnBg=FFFFFF"
                alt="Broccoli"
                width="100"
              />
            </td>
            <td>Broccoli</td>
            <td>$3 a head</td>
          </tr>
        </tbody>
      </table>

      <h1>Booking Form</h1>
      <form action="" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" /><br /><br />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" /><br /><br />

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" /><br /><br />

        <label for="date">Date:</label>
        <input type="date" id="date" name="date" /><br /><br />

        <label for="time">Time:</label>
        <input type="time" id="time" name="time" /><br /><br />

        <label for="guests">Number of Guests:</label>
        <input type="number" id="guests" name="guests" /><br /><br />

        <input type="submit" value="Submit" />
      </form>

      <h1>Car Purchase Form</h1>
      <form action="" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" /><br /><br />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" /><br /><br />

        <label for="phone">Phone:</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          pattern="[0-9]{3}-[0-9]{4}-[0-9]{4}"
          placeholder="123-4567-8901"
        /><br /><br />

        <label for="car">Choose a Car:</label>
        <select id="car" name="car">
          <option value="Model-1">Model 1</option>
          <option value="Model-2">Model 2</option>
          <option value="Model-3">Model 3</option></select
        ><br /><br />

        <label for="color">Choose a Color:</label>
        <select id="color" name="color">
          <option value="red">Red</option>
          <option value="blue">Blue</option>
          <option value="green">Green</option></select
        ><br /><br />

        <label for="quantity">Quantity:</label>
        <input
          type="number"
          id="quantity"
          name="quantity"
          min="0"
        /><br /><br />

        <label for="delivery-date">Delivery Date :</label>
        <input
          type="date"
          id="delivery-date"
          name="delivery-date"
        /><br /><br />

        <input type="submit" value="Submit" />
      </form>
    </main>
  </body>
</html>
